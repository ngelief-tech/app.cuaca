<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWeather — Professional Weather Forecast</title>
    <meta name="description" content="SkyWeather is a professional weather forecast application providing real-time weather data, hourly and 7-day forecasts powered by the Open-Meteo API.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z'/></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ========== HEADER ========== -->
    <header class="app-header">
        <div class="header-inner">
            <!-- Brand / Logo -->
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2v2" />
                    <path d="m5.6 5.6 1.4 1.4" />
                    <path d="M2 9h2" />
                    <path d="m16.4 5.6-1.4 1.4" />
                    <circle cx="11" cy="9" r="3" />
                    <path d="M18 14h-1.26A4 4 0 1 0 13 20h5a3 3 0 0 0 0-6z" />
                </svg>
                <span class="brand-name">SkyWeather</span>
            </div>

            <!-- Search -->
            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search city..."
                        autocomplete="off"
                        aria-label="Search for a city"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-controls="suggestions"
                    >
                    <div id="suggestions" class="suggestions-dropdown" role="listbox"></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="themeToggle" class="btn-control theme-toggle" aria-label="Toggle dark mode" title="Toggle dark / light mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2"/><path d="M12 20v2"/>
                        <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                        <path d="M2 12h2"/><path d="M20 12h2"/>
                        <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                    </svg>
                </button>
                <button id="unitToggle" class="btn-control" aria-label="Toggle temperature unit" title="Toggle °C / °F">
                    <span id="unitLabel">°C</span>
                </button>
                <button id="geoBtn" class="btn-control" aria-label="Use my location" title="Use my location">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                </button>
                <button id="refreshBtn" class="btn-control" aria-label="Refresh weather data" title="Refresh weather">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M3 21v-5h5" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="app-main">
        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <div class="spinner" aria-hidden="true"></div>
            <p class="loading-text">Loading weather data…</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-state" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="error-icon" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 8v4" />
                <path d="M12 16h.01" />
            </svg>
            <p id="errorMessage" class="error-message">Something went wrong.</p>
            <button id="errorRetryBtn" class="btn-retry">Try Again</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard" style="display: none;">
            <!-- Current Weather -->
            <section class="card card-current" aria-label="Current weather">
                <div class="current-weather">
                    <div class="current-weather__top">
                        <h2 class="current-weather__location" id="locationName">—</h2>
                        <p class="current-weather__date" id="currentDate">—</p>
                        <p class="current-weather__time" id="liveTime">—</p>
                    </div>
                    <div class="current-weather__main">
                        <div class="current-weather__temp-group">
                            <span class="current-weather__temp" id="currentTemp">—</span>
                            <span class="current-weather__unit" id="currentTempUnit">°C</span>
                        </div>
                        <div class="current-weather__icon" id="currentIcon"></div>
                    </div>
                    <div class="current-weather__bottom">
                        <p class="current-weather__desc" id="currentDesc">—</p>
                        <p class="current-weather__feels" id="currentFeels">—</p>
                        <p class="current-weather__updated" id="lastUpdated">—</p>
                    </div>
                </div>
            </section>

            <!-- Weather Details -->
            <section class="card card-details" aria-label="Current weather details">
                <h3 class="card-title">Weather Details</h3>
                <div class="details-grid" id="weatherDetails"></div>
            </section>

            <!-- Hourly Forecast -->
            <section class="card card-hourly" aria-label="Hourly forecast">
                <h3 class="card-title">Hourly Forecast</h3>
                <div class="hourly-scroll" id="hourlyForecast"></div>
            </section>

            <!-- 7-Day Forecast -->
            <section class="card card-daily" aria-label="7-day forecast">
                <h3 class="card-title">7-Day Forecast</h3>
                <div class="daily-list" id="dailyForecast"></div>
            </section>

            <!-- Additional Information -->
            <section class="card card-additional" aria-label="Additional weather information">
                <h3 class="card-title">Additional Information</h3>
                <div class="additional-grid" id="additionalInfo"></div>
            </section>
        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="app-footer">
        <p>SkyWeather &middot; Weather data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
    </footer>

    <!-- ========== SCRIPTS ========== -->
    <script src="js/weather.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
